<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerenciador de Projetos — mockup do novo design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap">
<style>
/* ==========================================================================
   MOCKUP — referência: referencias/modelo2 (fonte Urbanist, índigo #3e30d9,
   vidro fosco, cantos muito arredondados). Não é código de produção.
   Os valores abaixo são a PROPOSTA de tokens para src/styles/tokens.css.

   Desvio deliberado da referência: o verde #51b206 tem 2,45–2,72:1 de
   contraste (mínimo do projeto: 4,5:1 texto / 3:1 componente). Aqui o verde
   é #2f7a00 (4,76:1 sobre o vidro). O #51b206 original só serve de detalhe
   decorativo, e neste mockup não é usado.
   ========================================================================== */
:root {
  --font: 'Urbanist', system-ui, -apple-system, 'Segoe UI', sans-serif;

  --indigo: #3e30d9;        /* 7,99:1 com texto branco */
  --indigo-hover: #2f23b5;
  --verde: #2f7a00;         /* 4,76:1 sobre o vidro; 5,38:1 com texto branco */

  --canvas-a: #e3e8f5;
  --canvas-b: #cfd6ee;
  --glass: rgba(255, 255, 255, .62);
  --glass-strong: rgba(255, 255, 255, .88);
  --glass-line: rgba(255, 255, 255, .78);
  --line: rgba(76, 84, 112, .18);
  --head: rgba(112, 128, 205, .14);
  --track: #cdd3ea;

  --ink: #1c1e3c;           /* 14,3:1 sobre o vidro */
  --ink-muted: #4b5271;     /* 6,78:1 sobre o vidro; 5,29:1 sobre o degradê escuro */

  --r-card: 26px;
  --r-inner: 16px;
  --shadow: 0 14px 34px -16px rgba(46, 53, 110, .35);
  --touch: 44px;
}

/* status: fundo suave + texto escuro + cor forte (gráficos, bordas) */
.st-not_started { --bg: #e1e5ef; --fg: #3b4256; --strong: #6a7290; }
.st-working     { --bg: #dcd8ff; --fg: #2a1fb0; --strong: #3e30d9; }
.st-review      { --bg: #ffe6b0; --fg: #6b4200; --strong: #b7791f; }
.st-done        { --bg: #d3f0bd; --fg: #245c00; --strong: #2f7a00; }
.st-stuck       { --bg: #ffd9d6; --fg: #8a1c14; --strong: #c2362d; }
.pr-low      { --bg: #e1e5ef; --fg: #3b4256; }
.pr-medium   { --bg: #d6e7fb; --fg: #1f4f8a; }
.pr-high     { --bg: #ffe0c2; --fg: #7a3d00; }
.pr-critical { --bg: #b4232a; --fg: #ffffff; }
.u-ana { --c: #3e30d9; } .u-beto { --c: #0f766e; } .u-carla { --c: #a3202a; } .u-diego { --c: #8a4b00; }

* { box-sizing: border-box; }
html { scroll-padding-bottom: 7rem; }
body {
  margin: 0; min-height: 100vh; font-family: var(--font); font-size: 15px; line-height: 1.45;
  color: var(--ink); -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(1100px 560px at 8% -8%, #f6f8fe 0%, transparent 62%),
    linear-gradient(160deg, var(--canvas-a), var(--canvas-b));
  background-attachment: fixed;
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--indigo); outline-offset: 2px; border-radius: 10px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---- casca ------------------------------------------------------------- */
.app { display: grid; grid-template-columns: 88px minmax(0, 1fr); max-width: 1440px; margin: 0 auto; padding: 24px 24px 96px 16px; }
.rail { position: sticky; top: 24px; height: calc(100vh - 48px); display: flex; flex-direction: column; align-items: center; gap: 14px; }
.rail .grow { flex: 1; }
.logo { width: 52px; height: 52px; border-radius: 50%; background: var(--indigo); display: grid; place-items: center; margin-bottom: 14px; }
.rbtn {
  width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--glass-line); background: var(--glass);
  backdrop-filter: blur(14px); display: grid; place-items: center; color: var(--ink); text-decoration: none;
  transition: background .15s, box-shadow .15s;
}
.rbtn:hover { background: var(--glass-strong); }
.rbtn[aria-current="page"] { background: #fff; color: var(--indigo); box-shadow: var(--shadow); }
.rbtn.sair { color: #8a1c14; }

.main { min-width: 0; }
.top { display: grid; grid-template-columns: minmax(180px, 1fr) auto minmax(180px, 1fr); align-items: center; gap: 16px; margin-bottom: 20px; }
.hello p:first-child { font-size: 26px; font-weight: 500; letter-spacing: -.01em; }
.hello b { font-weight: 700; }
.hello p:last-child { color: var(--ink-muted); font-size: 14px; }
.actions { display: flex; justify-content: flex-end; align-items: center; gap: 12px; }

.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(14px); }
.tab { border: 0; background: transparent; min-height: var(--touch); padding: 0 22px; border-radius: 999px; font-weight: 600; color: var(--ink); }
.tab:hover { background: rgba(255, 255, 255, .7); }
.tab[aria-selected="true"] { background: var(--indigo); color: #fff; }

.ibtn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--glass-line); background: var(--glass); backdrop-filter: blur(14px); display: grid; place-items: center; }
.ibtn:hover { background: var(--glass-strong); }
.stack { display: flex; }
.stack .av { width: 36px; height: 36px; margin-left: -6px; border: 2px solid #eef1fa; }
.stack .av:first-child { margin-left: 0; }
.me { width: 48px; height: 48px; font-size: 15px; }

.av { width: 32px; height: 32px; border-radius: 50%; background: var(--c); color: #fff; display: inline-grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }

.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid transparent; font-weight: 600; }
.btn-primary { background: var(--indigo); color: #fff; }
.btn-primary:hover { background: var(--indigo-hover); }
.btn-glass { background: var(--glass-strong); border-color: var(--glass-line); color: var(--ink); }
.btn-glass:hover { background: #fff; }
.btn-ghost { background: transparent; color: var(--indigo); }
.btn-ghost:hover { background: rgba(255, 255, 255, .6); }
a.btn { text-decoration: none; }

/* ---- vidro ------------------------------------------------------------- */
.card { background: var(--glass); border: 1px solid var(--glass-line); border-radius: var(--r-card); backdrop-filter: blur(16px); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 18px 22px 10px; }
.card-h h2 { font-size: 19px; font-weight: 600; }
.card-h .meta { color: var(--ink-muted); font-size: 14px; }
.card-h .sp { flex: 1; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 999px; background: var(--bg); color: var(--fg); font-weight: 600; font-size: 13px; white-space: nowrap; }
.pill.late { --bg: #ffd9d6; --fg: #8a1c14; }

progress { appearance: none; -webkit-appearance: none; width: 100%; height: 8px; border: 0; border-radius: 999px; overflow: hidden; background: var(--track); color: var(--indigo); }
progress::-webkit-progress-bar { background: var(--track); }
progress::-webkit-progress-value { background: var(--indigo); border-radius: 999px; }
progress::-moz-progress-bar { background: var(--indigo); border-radius: 999px; }
progress.ok { color: var(--verde); }
progress.ok::-webkit-progress-value { background: var(--verde); }
progress.ok::-moz-progress-bar { background: var(--verde); }
.prog { display: flex; align-items: center; gap: 10px; min-width: 120px; }
.prog span { font-size: 13px; font-weight: 600; min-width: 38px; text-align: right; }

/* ---- título do board --------------------------------------------------- */
.board-h { display: flex; align-items: center; gap: 14px; margin: 4px 4px 16px; flex-wrap: wrap; }
.board-h h1 { font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
.board-h .meta { color: var(--ink-muted); }
.board-h .sp { flex: 1; }
.fav { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; color: #b7791f; }
.fav svg { fill: currentColor; }

/* ---- tabela ------------------------------------------------------------ */
.groups { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.gdot { width: 12px; height: 12px; border-radius: 50%; background: var(--g); flex: none; }
.g-azure { --g: #3e30d9; } .g-grape { --g: #7a35c7; } .g-mint { --g: #2f7a00; }
.gprog { display: flex; align-items: center; gap: 10px; width: 190px; max-width: 100%; }
.gprog span { font-size: 13px; font-weight: 700; min-width: 40px; text-align: right; }
.tw { overflow-x: auto; padding: 0 10px 8px; }
table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 860px; }
th { text-align: left; font-weight: 600; font-size: 13px; color: var(--ink-muted); background: var(--head); padding: 10px 14px; white-space: nowrap; }
th:first-child { border-radius: 14px 0 0 14px; } th:last-child { border-radius: 0 14px 14px 0; }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: rgba(255, 255, 255, .5); }
td.title { font-weight: 600; min-width: 260px; }
td.title small { display: block; font-weight: 500; color: var(--ink-muted); font-size: 12.5px; }
.who { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--indigo); margin: 0; }
.chk { display: grid; place-items: center; }
.due { white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.add { margin: 4px 10px 12px; }

/* ---- kanban ------------------------------------------------------------ */
.kan { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(236px, 1fr); gap: 16px; overflow-x: auto; padding: 2px 2px 14px; }
.col { padding: 14px; display: flex; flex-direction: column; gap: 12px; align-content: start; min-height: 420px; }
.col-h { display: flex; align-items: center; gap: 10px; }
.col-h .n { color: var(--ink-muted); font-weight: 600; }
.task { background: var(--glass-strong); border: 1px solid #fff; border-radius: var(--r-inner); padding: 14px; display: grid; gap: 10px; box-shadow: 0 6px 16px -10px rgba(46, 53, 110, .35); }
.task h3 { font-size: 15.5px; font-weight: 600; line-height: 1.3; }
.task .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.kebab { flex: none; min-width: 44px; width: 44px; height: 44px; margin: -10px -10px 0 0; border: 0; background: transparent; border-radius: 50%; display: grid; place-items: center; color: var(--ink-muted); }
.kebab:hover { background: var(--head); }
.task .top2 { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
.col .empty { color: var(--ink-muted); font-size: 14px; padding: 8px 4px; }

/* ---- gantt ------------------------------------------------------------- */
.gantt { --w: 34px; --days: 28; --lab: 300px; overflow-x: auto; padding: 8px 12px 16px; }
.g-inner { min-width: calc(var(--lab) + var(--w) * var(--days)); position: relative; }
.g-row { display: grid; grid-template-columns: var(--lab) calc(var(--w) * var(--days)); align-items: center; min-height: 46px; border-bottom: 1px solid var(--line); }
.g-row:last-child { border-bottom: 0; }
.g-lab { position: sticky; left: 0; z-index: 2; background: rgba(238, 241, 250, .96); padding: 6px 12px 6px 6px; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; height: 100%; }
.g-lab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-time { position: relative; height: 100%; min-height: 46px;
  background: repeating-linear-gradient(90deg, transparent 0 calc(var(--w) - 1px), var(--line) calc(var(--w) - 1px) var(--w)); }
.g-we { position: absolute; top: 0; bottom: 0; width: calc(var(--w) * 2); background: rgba(112, 128, 205, .1); }
.g-head { min-height: 52px; }
.g-head .g-lab { color: var(--ink-muted); font-weight: 600; }
.g-day { position: absolute; top: 6px; width: var(--w); text-align: center; font-size: 12px; color: var(--ink-muted); line-height: 1.2; }
.g-day b { display: block; color: var(--ink); font-size: 13.5px; }
.bar { position: absolute; top: 9px; height: 28px; border-radius: 9px; background: var(--bg); border: 1.5px solid var(--strong); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--strong); opacity: .9; }
.bar.clip { border-radius: 9px 0 0 9px; }
.marco { position: absolute; top: 13px; width: 20px; height: 20px; background: var(--strong); transform: rotate(45deg); border-radius: 4px; margin-left: 7px; }
.hoje { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--indigo); z-index: 1; }
.hoje.tag::before { content: 'Hoje'; position: absolute; top: -2px; left: 50%; transform: translateX(-50%); background: var(--indigo); color: #fff; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
.legenda { display: flex; gap: 14px; flex-wrap: wrap; padding: 4px 22px 16px; color: var(--ink-muted); font-size: 13px; }

/* ---- dashboard --------------------------------------------------------- */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 4px; margin-bottom: 18px; }
.kpi { padding: 16px 22px; border-right: 1px solid var(--line); display: grid; gap: 12px; }
.kpi:last-child { border-right: 0; }
.kpi .lab { display: flex; align-items: center; gap: 10px; color: var(--ink-muted); font-weight: 500; }
.kpi .val { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.kpi .val b { font-size: 38px; font-weight: 600; letter-spacing: -.02em; line-height: 1; }
.kpi .val span { font-size: 14px; color: var(--ink-muted); font-weight: 500; text-align: right; }
.kpi .val span.good { color: var(--verde); font-weight: 700; }
.dgrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.dcol { display: grid; gap: 18px; }
.donut { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: center; padding: 8px 24px 24px; }
.donut svg { width: 100%; height: auto; }
.donut circle { fill: none; stroke: var(--strong); stroke-width: 22; }
.donut .track { stroke: var(--track); }
.donut text { text-anchor: middle; fill: var(--ink); }
.dlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.dlist li { display: flex; align-items: center; gap: 10px; }
.dlist .sw { width: 14px; height: 14px; border-radius: 5px; background: var(--strong); flex: none; }
.dlist .nm { flex: 1; font-weight: 500; }
.dlist .pc { font-weight: 700; }
.gp { list-style: none; margin: 0; padding: 4px 22px 22px; display: grid; gap: 16px; }
.gp li { display: grid; gap: 6px; }
.gp .r { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.gp .r span:last-child { margin-left: auto; }
.feed { list-style: none; margin: 0; padding: 4px 22px 20px; display: grid; gap: 4px; }
.feed li { display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.feed li:last-child { border-bottom: 0; }
.feed p { font-size: 14.5px; }
.feed small { display: block; color: var(--ink-muted); margin-top: 2px; }
.feed q { color: var(--ink-muted); }

/* ---- aviso do PWA (AvisoPWA) ------------------------------------------ */
.pwa { position: fixed; right: 24px; bottom: 24px; z-index: 40; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 12px 14px 12px 20px; border-radius: 22px; background: var(--glass-strong); border: 1px solid #fff; backdrop-filter: blur(16px); box-shadow: 0 18px 40px -14px rgba(46, 53, 110, .5); max-width: calc(100vw - 32px); }
.pwa[hidden] { display: none; }

/* ---- responsivo (mobile primeiro é o contrato do projeto; aqui o mockup é desktop-first e degrada) --- */
@media (max-width: 1180px) {
  .top { grid-template-columns: 1fr auto; }
  .tabs { grid-column: 1 / -1; grid-row: 2; justify-self: start; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .kpi:nth-child(2) { border-right: 0; } .kpi:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .dgrid { grid-template-columns: 1fr; }
  .invite-t { display: none; }
}
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; padding: 12px 12px 168px; }
  .rail { position: fixed; z-index: 30; left: 12px; right: 12px; bottom: 12px; top: auto; height: auto; flex-direction: row; justify-content: space-between;
    padding: 8px 12px; border-radius: 999px; background: var(--glass-strong); border: 1px solid #fff; backdrop-filter: blur(16px); box-shadow: var(--shadow); gap: 6px; }
  .rail .logo, .rail .grow { display: none; }
  .rbtn { width: var(--touch); height: var(--touch); background: transparent; border-color: transparent; }
  .tabs { width: 100%; overflow-x: auto; }
  .tab { padding: 0 16px; flex: 1; }
  .btn { min-height: var(--touch); }
  .chk { min-width: var(--touch); min-height: var(--touch); margin: -8px -6px; }
  .hello p:first-child { font-size: 22px; }
  .board-h h1 { font-size: 26px; }
  .donut { grid-template-columns: 1fr; } .donut svg { max-width: 220px; margin: 0 auto; }
  .kpi { padding: 14px; } .kpi .val b { font-size: 30px; }
  .pwa { left: 12px; right: 12px; bottom: 88px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">

  <nav class="rail" aria-label="Navegação principal">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="#fff"><rect x="3" y="3" width="4.5" height="18" rx="1.6"/><rect x="9.75" y="3" width="4.5" height="13" rx="1.6"/><rect x="16.5" y="3" width="4.5" height="8" rx="1.6"/></svg>
    </div>
    <a class="rbtn" href="#tabela" aria-current="page" aria-label="Meus Painéis" title="Meus Painéis"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg></a>
    <a class="rbtn" href="#tabela" aria-label="Favoritos" title="Favoritos"><svg class="i" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></a>
    <a class="rbtn" href="#dashboard" aria-label="Atividades" title="Atividades"><svg class="i" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></a>
    <a class="rbtn" href="#tabela" aria-label="Modelos" title="Modelos"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></a>
    <a class="rbtn" href="#tabela" aria-label="Ajuda" title="Ajuda"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></a>
    <div class="grow"></div>
    <a class="rbtn" href="#tabela" aria-label="Configurações" title="Configurações"><svg class="i" viewBox="0 0 24 24"><line x1="21" y1="4" x2="14" y2="4"/><line x1="10" y1="4" x2="3" y2="4"/><line x1="21" y1="12" x2="12" y2="12"/><line x1="8" y1="12" x2="3" y2="12"/><line x1="21" y1="20" x2="16" y2="20"/><line x1="12" y1="20" x2="3" y2="20"/><line x1="14" y1="2" x2="14" y2="6"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="16" y1="18" x2="16" y2="22"/></svg></a>
    <a class="rbtn sair" href="#tabela" aria-label="Sair" title="Sair"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></a>
  </nav>

  <div class="main">
    <header class="top">
      <div class="hello">
        <p>Bom dia, <b>Ana</b></p>
        <p>Meu Workspace</p>
      </div>

      <div class="tabs" role="tablist" aria-label="Visões do painel">
        <button class="tab" role="tab" id="t-tabela" aria-controls="p-tabela" aria-selected="true">Tabela</button>
        <button class="tab" role="tab" id="t-kanban" aria-controls="p-kanban" aria-selected="false" tabindex="-1">Kanban</button>
        <button class="tab" role="tab" id="t-gantt" aria-controls="p-gantt" aria-selected="false" tabindex="-1">Gantt</button>
        <button class="tab" role="tab" id="t-dashboard" aria-controls="p-dashboard" aria-selected="false" tabindex="-1">Dashboard</button>
      </div>

      <div class="actions">
        <button class="ibtn" aria-label="Notificações"><svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
        <div class="stack" aria-hidden="true"><span class="av u-beto">BS</span><span class="av u-carla">CD</span><span class="av u-diego">DM</span></div>
        <button class="btn btn-glass" aria-label="Convidar integrantes"><svg class="i" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg><span class="invite-t">Convidar</span></button>
        <span class="av me u-ana" role="img" aria-label="Ana Lima">AL</span>
      </div>
    </header>

    <div class="board-h">
      <h1>Sprint Alpha Q3</h1>
      <button class="fav" aria-label="Desfavoritar Sprint Alpha Q3" aria-pressed="true"><svg class="i" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
      <p class="meta" id="resumo"></p>
      <span class="sp"></span>
      <button class="btn btn-primary"><svg class="i" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Nova tarefa</button>
    </div>

    <main>
      <section id="p-tabela" role="tabpanel" aria-labelledby="t-tabela" tabindex="0"><div class="groups" id="groups"></div></section>
      <section id="p-kanban" role="tabpanel" aria-labelledby="t-kanban" tabindex="0" hidden><div class="kan" id="kan"></div></section>
      <section id="p-gantt" role="tabpanel" aria-labelledby="t-gantt" tabindex="0" hidden>
        <div class="card"><div class="gantt" id="gantt"></div>
          <p class="legenda" id="legenda"></p>
        </div>
      </section>
      <section id="p-dashboard" role="tabpanel" aria-labelledby="t-dashboard" tabindex="0" hidden>
        <div class="card kpis" id="kpis"></div>
        <div class="dgrid">
          <div class="dcol">
            <div class="card"><div class="card-h"><h2>Distribuição por status</h2></div><div class="donut" id="donut"></div></div>
            <div class="card"><div class="card-h"><h2>Progresso por grupo</h2></div><ul class="gp" id="gp"></ul></div>
          </div>
          <div class="card"><div class="card-h"><h2>Atividades recentes</h2><span class="sp"></span><a class="btn btn-ghost" href="#dashboard">Ver todas</a></div><ul class="feed" id="feed"></ul></div>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="pwa" id="pwa" role="status">
  <svg class="i" viewBox="0 0 24 24" style="color:var(--indigo)"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
  <span>Instalar o app no seu dispositivo</span>
  <button class="btn btn-ghost" id="pwa-no">Agora não</button>
  <button class="btn btn-primary">Instalar</button>
</div>

<script>
/* Dados de exemplo. UMA fonte alimenta as 4 telas, então os números batem entre elas. */
const HOJE = new Date(2026, 8, 29);          // ter, 29/09/2026
const INI = new Date(2026, 8, 14);           // início da janela do Gantt (seg, 14/09)
const DIAS = 28;
const USERS = { ana: ['Ana Lima', 'AL'], beto: ['Beto Souza', 'BS'], carla: ['Carla Dias', 'CD'], diego: ['Diego Melo', 'DM'] };
const STATUS = { not_started: 'Não iniciado', working: 'Em andamento', review: 'Em revisão', done: 'Pronto', stuck: 'Travado' };
const ORDEM = ['not_started', 'working', 'review', 'done', 'stuck'];
const PRIO = { low: 'Baixa', medium: 'Média', high: 'Alta', critical: 'Crítica' };
const GRUPOS = [
  { id: 'dev', nome: 'Em desenvolvimento', cor: 'g-azure' },
  { id: 'todo', nome: 'A fazer', cor: 'g-grape' },
  { id: 'fim', nome: 'Concluído', cor: 'g-mint' },
];
const T = [
  { g: 'dev',  t: 'Refatorar arquitetura de autenticação', u: 'ana',   s: 'working',     p: 'high',     ini: '2026-09-22', fim: '2026-10-02', pc: 60,  sub: '3/5' },
  { g: 'dev',  t: 'Integrar API de pagamentos',            u: 'beto',  s: 'review',      p: 'critical', ini: '2026-09-21', fim: '2026-09-30', pc: 90,  sub: '4/4' },
  { g: 'dev',  t: 'Corrigir cálculo de horas no relatório', u: 'carla', s: 'stuck',       p: 'high',     ini: '2026-09-18', fim: '2026-09-25', pc: 30 },
  { g: 'todo', t: 'Entrega da versão beta',                u: 'diego', s: 'not_started', p: 'critical', ini: '2026-10-08', fim: '2026-10-08', pc: 0,   marco: true },
  { g: 'todo', t: 'Documentar endpoints públicos',         u: 'ana',   s: 'not_started', p: 'low',      ini: '2026-10-09', fim: '2026-10-15', pc: 0 },
  { g: 'todo', t: 'Revisar textos de mensagens de erro',   u: 'carla', s: 'working',     p: 'medium',   ini: '2026-09-23', fim: '2026-09-27', pc: 20,  sub: '1/5' },
  { g: 'fim',  t: 'Configurar pipeline de CI',             u: 'beto',  s: 'done',        p: 'medium',   ini: '2026-09-17', fim: '2026-09-22', pc: 100 },
  { g: 'fim',  t: 'Escolher stack do front-end',           u: 'ana',   s: 'done',        p: 'high',     ini: '2026-09-14', fim: '2026-09-18', pc: 100 },
];
const d = (iso) => { const [y, m, dd] = iso.split('-').map(Number); return new Date(y, m - 1, dd); };
const fmt = (iso) => d(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
const atrasada = (x) => x.s !== 'done' && d(x.fim) < HOJE;
const idx = (iso) => Math.round((d(iso) - INI) / 86400000);
const av = (u, extra = '') => `<span class="av u-${u}" aria-hidden="true" ${extra}>${USERS[u][1]}</span>`;
const pillS = (s) => `<span class="pill st-${s}">${STATUS[s]}</span>`;
const pillP = (p) => `<span class="pill pr-${p}">${PRIO[p]}</span>`;
const prog = (pc, nome, ok) => `<div class="prog"><progress max="100" value="${pc}" ${ok ? 'class="ok"' : ''} aria-label="Progresso de ${nome}"></progress><span>${pc}%</span></div>`;
const kebab = (t) => `<button class="kebab" aria-label="Ações de ${t}"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>`;
const media = (arr) => arr.length ? Math.round(arr.reduce((a, x) => a + x.pc, 0) / arr.length) : 0;

/* métricas (mesma regra do app: maior resto para os percentuais somarem 100) */
const total = T.length, feitas = T.filter((x) => x.s === 'done').length, atras = T.filter(atrasada).length;
const taxa = Math.round((feitas / total) * 1000) / 10;
function distribuicao() {
  const bruto = ORDEM.map((s) => ({ s, n: T.filter((x) => x.s === s).length }));
  const cru = bruto.map((b) => ({ ...b, v: (b.n / total) * 1000 }));
  const base = cru.map((c) => ({ ...c, f: Math.floor(c.v) }));
  let falta = 1000 - base.reduce((a, c) => a + c.f, 0);
  [...base].sort((a, b) => (b.v - b.f) - (a.v - a.f)).forEach((c) => { if (falta > 0) { c.f += 1; falta--; } });
  return base.map((c) => ({ s: c.s, n: c.n, pc: c.f / 10 }));
}
document.getElementById('resumo').textContent = `${total} tarefas · ${atras} atrasadas · ${taxa.toString().replace('.', ',')}% concluído`;

/* Tabela */
document.getElementById('groups').innerHTML = GRUPOS.map((g) => {
  const ts = T.filter((x) => x.g === g.id);
  const linhas = ts.map((x) => `
    <tr>
      <td><label class="chk"><input type="checkbox" aria-label="Selecionar ${x.t}" ${x.s === 'done' ? 'checked' : ''}></label></td>
      <td class="title">${x.t}${x.sub ? `<small>${x.sub} subtarefas</small>` : ''}${x.marco ? '<small>Marco</small>' : ''}</td>
      <td><span class="who">${av(x.u)}${USERS[x.u][0]}</span></td>
      <td>${pillS(x.s)}</td>
      <td>${pillP(x.p)}</td>
      <td><span class="due">${fmt(x.fim)}${atrasada(x) ? '<span class="pill late">Atrasada</span>' : ''}</span></td>
      <td>${prog(x.pc, x.t, x.s === 'done')}</td>
    </tr>`).join('');
  return `<div class="card">
    <div class="card-h"><span class="gdot ${g.cor}" aria-hidden="true"></span><h2>${g.nome}</h2><span class="meta">${ts.length} ${ts.length === 1 ? 'tarefa' : 'tarefas'}</span><span class="sp"></span>
      <div class="gprog"><progress max="100" value="${media(ts)}" ${media(ts) === 100 ? 'class="ok"' : ''} aria-label="Progresso do grupo ${g.nome}"></progress><span>${media(ts)}%</span></div>
      ${kebab('grupo ' + g.nome)}</div>
    <div class="tw"><table>
      <caption class="sr-only">Tarefas do grupo ${g.nome}</caption>
      <thead><tr><th scope="col"><span class="sr-only">Selecionar</span></th><th scope="col">Tarefa</th><th scope="col">Responsável</th><th scope="col">Status</th><th scope="col">Prioridade</th><th scope="col">Prazo</th><th scope="col">Progresso</th></tr></thead>
      <tbody>${linhas}</tbody></table></div>
    <button class="btn btn-ghost add"><svg class="i" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Adicionar tarefa</button>
  </div>`;
}).join('');

/* Kanban */
document.getElementById('kan').innerHTML = ORDEM.map((s) => {
  const ts = T.filter((x) => x.s === s);
  const cards = ts.map((x) => `<article class="task">
      <div class="top2"><h3>${x.t}</h3>${kebab(x.t)}</div>
      <div class="row">${pillP(x.p)}<span class="due">${fmt(x.fim)}${atrasada(x) ? '<span class="pill late">Atrasada</span>' : ''}</span></div>
      ${prog(x.pc, x.t, x.s === 'done')}
      <div class="who">${av(x.u)}<span>${USERS[x.u][0]}</span></div>
    </article>`).join('') || '<p class="empty">Nenhuma tarefa aqui.</p>';
  return `<section class="card col" aria-label="Coluna ${STATUS[s]}">
    <div class="col-h">${pillS(s)}<span class="n">${ts.length}</span></div>${cards}</section>`;
}).join('');

/* Gantt */
(function () {
  const W = 34, we = [5, 6, 12, 13, 19, 20, 26, 27];
  const dias = Array.from({ length: DIAS }, (_, i) => { const x = new Date(INI); x.setDate(x.getDate() + i); return x; });
  const inicial = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
  const cab = dias.map((x, i) => `<span class="g-day" style="left:${i * W}px">${inicial[x.getDay()]}<b>${x.getDate()}</b></span>`).join('');
  const fundo = we.filter((_, i) => i % 2 === 0).map((i) => `<i class="g-we" style="left:${i * W}px"></i>`).join('');
  const xHoje = idx('2026-09-29') * W + W / 2 - 1;
  const hoje = `<i class="hoje" style="left:${xHoje}px"></i>`;
  const hojeTag = `<i class="hoje tag" style="left:${xHoje}px"></i>`;
  const linhas = T.map((x) => {
    let a = idx(x.ini), b = idx(x.fim), clipR = false;
    if (b > DIAS - 1) { b = DIAS - 1; clipR = true; }
    const corpo = x.marco
      ? `<i class="marco st-${x.s}" style="left:${a * W}px" title="Marco: ${fmt(x.fim)}"></i>`
      : `<div class="bar st-${x.s} ${clipR ? 'clip' : ''}" style="left:${a * W + 2}px;width:${(b - a + 1) * W - 4}px" role="img" aria-label="${x.t}: ${fmt(x.ini)} a ${fmt(x.fim)}, ${x.pc}% concluído"><i style="width:${x.pc}%"></i></div>`;
    return `<div class="g-row"><div class="g-lab">${av(x.u)}<span title="${x.t}">${x.t}</span></div><div class="g-time">${fundo}${hoje}${corpo}</div></div>`;
  }).join('');
  document.getElementById('gantt').innerHTML = `<div class="g-inner"><div class="g-row g-head"><div class="g-lab">Tarefa</div><div class="g-time">${fundo}${hojeTag}${cab}</div></div>${linhas}</div>`;
  document.getElementById('legenda').innerHTML = ORDEM.map((s) => `<span class="pill st-${s}">${STATUS[s]}</span>`).join('') + '<span>◆ marco</span><span>Fim de semana em faixa mais escura</span>';
})();

/* Dashboard */
document.getElementById('kpis').innerHTML = [
  ['Taxa de conclusão', taxa.toString().replace('.', ',') + '%', `${feitas} de ${total} tarefas`, ''],
  ['Atrasadas', atras, atras ? 'precisam de atenção' : 'nenhuma', ''],
  ['Em andamento', T.filter((x) => x.s === 'working').length, 'nesta sprint', ''],
  ['Total de tarefas', total, `${GRUPOS.length} grupos`, ''],
].map(([l, v, s]) => `<div class="kpi"><div class="lab">${l}</div><div class="val"><b>${v}</b><span>${s}</span></div></div>`).join('');

(function () {
  const dist = distribuicao(), R = 70, C = 2 * Math.PI * R;
  let acc = 0;
  const arcos = dist.filter((x) => x.n).map((x) => {
    const len = (x.n / total) * C;
    const el = `<circle class="st-${x.s}" cx="100" cy="100" r="${R}" stroke-dasharray="${len - 3} ${C - len + 3}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)"/>`;
    acc += len; return el;
  }).join('');
  document.getElementById('donut').innerHTML =
    `<svg viewBox="0 0 200 200" role="img" aria-label="Distribuição das ${total} tarefas por status"><circle class="track" cx="100" cy="100" r="${R}"/>${arcos}
      <text x="100" y="104" font-size="30" font-weight="600">${taxa.toString().replace('.', ',')}%</text>
      <text x="100" y="126" font-size="12" font-weight="500" style="fill:var(--ink-muted)">concluído</text></svg>
    <ul class="dlist">${dist.map((x) => `<li class="st-${x.s}"><span class="sw"></span><span class="nm">${STATUS[x.s]}</span><span>${x.n}</span><span class="pc">${String(x.pc).replace('.', ',')}%</span></li>`).join('')}</ul>`;
})();

document.getElementById('gp').innerHTML = GRUPOS.map((g) => {
  const pc = media(T.filter((x) => x.g === g.id));
  return `<li><div class="r"><span class="gdot ${g.cor}" aria-hidden="true"></span><span>${g.nome}</span><span>${pc}%</span></div>
    <progress max="100" value="${pc}" ${pc === 100 ? 'class="ok"' : ''} aria-label="Progresso do grupo ${g.nome}"></progress></li>`;
}).join('');

document.getElementById('feed').innerHTML = [
  ['beto', 'mudou <b>Integrar API de pagamentos</b> de Em andamento para Em revisão', 'há 2 h'],
  ['carla', 'comentou em <b>Corrigir cálculo de horas no relatório</b>: <q>Preciso do acesso ao banco de staging.</q>', 'há 5 h'],
  ['ana', 'criou <b>Documentar endpoints públicos</b>', 'ontem'],
  ['beto', 'mudou <b>Configurar pipeline de CI</b> para Pronto', 'ontem'],
].map(([u, txt, quando]) => `<li>${av(u)}<div><p><b>${USERS[u][0]}</b> ${txt}</p><small>${quando}</small></div></li>`).join('');

/* Abas: setas, Home/End e #hash (para link direto a cada visão) */
const tabs = [...document.querySelectorAll('[role=tab]')];
function abrir(tab, foco) {
  tabs.forEach((t) => {
    const on = t === tab;
    t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1;
    document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
  });
  if (foco) tab.focus();
  history.replaceState(null, '', '#' + tab.id.slice(2));
}
tabs.forEach((t, i) => {
  t.addEventListener('click', () => abrir(t));
  t.addEventListener('keydown', (e) => {
    const k = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
    if (k === undefined) return;
    e.preventDefault(); abrir(tabs[(k + tabs.length) % tabs.length], true);
  });
});
const daHash = () => document.getElementById('t-' + location.hash.slice(1));
if (daHash()) abrir(daHash());
window.addEventListener('hashchange', () => daHash() && abrir(daHash()));
document.getElementById('pwa-no').addEventListener('click', () => { document.getElementById('pwa').hidden = true; });
</script>
</body>
</html>
